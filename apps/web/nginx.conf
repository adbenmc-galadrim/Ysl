server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Isolation cross-origin (COOP/COEP) pour le WASM multithread, posée sur toute
  # l'app. Un add_header d'un bloc remplace ceux du niveau au-dessus : chaque bloc
  # de l'app inclut donc le fichier ; "always" la garde sur les 304 et les erreurs.

  # Fichiers fingerprintés par Vite : leur nom change à chaque build. La glue
  # `.mjs` d'onnxruntime-web (threads de l'OCR) doit sortir en JavaScript :
  # WebKit refuse un module servi en octet-stream.
  location /assets/ {
    include mime.types;
    types { application/javascript mjs; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/isolation.conf;
    try_files $uri =404;
  }

  # Les prototypes des spikes sont retirés (YSL-138) : sans ce bloc, le repli SPA
  # répondrait 200 sur leurs anciennes adresses.
  location ^~ /spike- {
    return 404;
  }

  # nginx ne connaît pas l'extension .webmanifest : sans type, iOS peut ignorer
  # le manifeste. Un bloc exact n'hérite pas des add_header du bloc préfixe.
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/isolation.conf;
  }

  # SPA : toute route inconnue renvoie index.html, jamais mis en cache pour
  # qu'un déploiement soit visible au rechargement suivant. sw.js et
  # version.json passent aussi par ici : en no-cache, la mise à jour est vue.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/isolation.conf;
    try_files $uri /index.html;
  }
}
