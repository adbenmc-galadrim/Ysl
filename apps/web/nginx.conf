server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Fichiers fingerprintés par Vite : leur nom change à chaque build.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA : toute route inconnue renvoie index.html, jamais mis en cache pour
  # qu'un déploiement soit visible au rechargement suivant.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
