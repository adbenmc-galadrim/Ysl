packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  lightningcss: true

# Single source of truth for versions shared by more than one workspace
# package, as in Emis. Consumers declare `"catalog:"` instead of a range.
catalog:
  '@fontsource/inter-tight': ^5.2.7
  '@tailwindcss/vite': ^4.3.3
  '@trpc/client': 11.18.0
  '@trpc/server': 11.18.0
  '@trpc/tanstack-react-query': 11.18.0
  '@types/node': ^22.15.3
  '@types/pg': ^8.21.0
  '@types/react': ^19.2.2
  '@types/react-dom': ^19.2.2
  better-auth: ^1.6.26
  dotenv: ^17.2.2
  drizzle-orm: ^0.45.2
  eslint: ^9.39.1
  pg: ^8.22.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.3.1
  tailwindcss: ^4.3.3
  tsx: ^4.23.11
  typescript: 6.0.3
  vite: ^8.0.0
  vitest: ^4.1.10
  zod: 4.4.3
