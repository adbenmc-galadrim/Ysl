name: courrier

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courrier
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?set it in .env, starting from .env.example}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d courrier']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
