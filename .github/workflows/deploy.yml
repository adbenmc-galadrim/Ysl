# Vérifie (`ci.yml`) puis déploie `prod` sur Coolify (shinseo.fr). Les ressources Coolify
# suivent cette branche et construisent les images sur le serveur ; leur auto-deploy doit
# rester coupé pour ne pas déployer deux fois.
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   secret   COOLIFY_TOKEN           jeton API Coolify (droit « deploy » seul ; le
#                                    suivi du déploiement se fait dans Coolify)
#   variable COOLIFY_URL             https://coolify.shinseo.fr
# Réglages de l'environnement GitHub `production` :
#   variable COOLIFY_RESOURCE_UUIDS  UUID de l'API puis du web, séparés par une virgule
name: Déploiement

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      force:
        description: Reconstruire les images sans cache (même commit, nouvelle version)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Vérification
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déploiement Coolify
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ysl.shinseo.fr
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      RESOURCE_UUIDS: ${{ vars.COOLIFY_RESOURCE_UUIDS }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      - name: Déclenche le déploiement
        run: |
          if [ -z "$RESOURCE_UUIDS" ]; then
            echo "::error::COOLIFY_RESOURCE_UUIDS manque dans l'environnement GitHub production"
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$RESOURCE_UUIDS&force=$FORCE")
          echo "$response" | jq .
