# Vérifie une pull request : lint, types et tests Vitest d'un côté ; de l'autre le
# build du Storybook et la comparaison de chaque écran à sa maquette (`pnpm visual`,
# qui échoue au-delà de `--max` % de pixels différents). Les planches
# référence | capture | diff de chaque écran sont jointes au run en artefact.
#
# `deploy.yml` appelle ce workflow avant de déployer `main` et `prod`.
name: Vérification

on:
  pull_request:
  workflow_call:

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint check-types test

  visual:
    name: Storybook et écrans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @repo/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache de Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installe Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/ui exec playwright install --with-deps chromium
      - name: Installe les dépendances système de Chromium
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/ui exec playwright install-deps chromium

      - name: Construit le Storybook
        run: pnpm build-storybook
      - name: Sert le Storybook
        run: |
          pnpm --filter @repo/ui exec vite preview --outDir storybook-static --port 6006 --strictPort &
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:6006/index.json > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Le Storybook statique ne répond pas sur le port 6006"
          exit 1
      - name: Compare les écrans aux maquettes
        run: pnpm visual -- --max 0.6

      - name: Planches des écrans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planches-visuelles
          path: packages/ui/visual/out
          retention-days: 7
          if-no-files-found: ignore
