server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Fichiers fingerprintés par Vite : leur nom change à chaque build.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Prototype du spike S1 (YSL-6), retiré avec apps/spike-camera.
  location /spike-camera/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri /spike-camera/index.html;
  }

  # nginx ne connaît pas l'extension .webmanifest : sans type, iOS peut ignorer
  # le manifeste. Un bloc exact n'hérite pas des add_header du bloc préfixe.
  location = /spike-camera/manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # Prototype du spike S4 (YSL-7), retiré avec apps/spike-storage. sw.js et
  # version.json doivent rester en no-cache pour que la mise à jour soit vue.
  location /spike-storage/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri /spike-storage/index.html;
  }

  location = /spike-storage/manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # Prototype du spike S5 (YSL-8), retiré avec apps/spike-email.
  location /spike-email/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri /spike-email/index.html;
  }

  location = /spike-email/manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # Prototype du spike S3 (YSL-12), retiré avec apps/spike-ocr. L'isolation
  # cross-origin (COOP/COEP) sert le WASM multithread ; "always" la garde sur les
  # 304 et les erreurs, et chaque bloc la répète : un add_header d'un bloc
  # remplace ceux du niveau au-dessus. onnxruntime-web charge son moteur en
  # module ES (.mjs), que nginx sert sinon en octet-stream, refusé par Safari.
  location /spike-ocr/ {
    include /etc/nginx/mime.types;
    types {
      application/javascript mjs;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri /spike-ocr/index.html;
  }

  # Prototype du spike S2 (YSL-11), retiré avec apps/spike-barcode. Le .wasm de
  # zxing est servi en application/wasm par mime.types de l'image nginx.
  location /spike-barcode/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri /spike-barcode/index.html;
  }

  location = /spike-barcode/manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # nginx ne connaît pas l'extension .webmanifest : sans type, iOS peut ignorer
  # le manifeste. Un bloc exact n'hérite pas des add_header du bloc préfixe.
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # SPA : toute route inconnue renvoie index.html, jamais mis en cache pour
  # qu'un déploiement soit visible au rechargement suivant. sw.js et
  # version.json passent aussi par ici : en no-cache, la mise à jour est vue.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
